name: Cypress Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  cypress-run:
    name: Run Cypress E2E Tests
    runs-on: ubuntu-latest
    environment: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          cd frontend
          npm ci
      
      - name: Start backend server
        working-directory: ./backend
        run: |
          npm install -g nodemon
          nohup npm run dev > server.log 2>&1 & echo $! > server_pid.txt
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: 'sqlite::memory:' # Corrected indentation
          JWT_SECRET: test-secret
      
      - name: Start frontend dev server
        working-directory: ./frontend
        run: |
          nohup npm run dev > frontend.log 2>&1 & echo $! > frontend_pid.txt
        env:
          VITE_API_URL: http://localhost:3000/api
      
      - name: Wait for servers to be ready
        working-directory: ./frontend
        run: |
          npx wait-on http://localhost:3000/api/health http://localhost:5173
      
      - name: Run Cypress tests
        working-directory: ./frontend
        run: npx cypress run --browser chrome --headless
        env:
          CYPRESS_BASE_URL: http://localhost:5173
          CYPRESS_API_URL: http://localhost:3000/api
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cypress-screenshots
          path: |
            frontend/cypress/screenshots/**/*
            frontend/cypress/videos/**/*
          retention-days: 7
      
      - name: Stop servers
        if: always()
        run: |
          # Use a more reliable way to kill the processes by PID
          kill $(cat backend/server_pid.txt) || true
          kill $(cat frontend/frontend_pid.txt) || true